<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบวัดระดับความว่างระดับมโหฬาร</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sukhumvit Set', 'Taviraj', 'Kanit', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }
        h1 {
            color: #4a4a4a;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .btn-option {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin: 10px 0;
            background: #f0f3f8;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 1rem;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .btn-option:hover {
            background: #6e8efb;
            color: white;
            border-color: #6e8efb;
            transform: translateY(-2px);
        }
        .btn-start {
            background: #ff4757;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }
        .btn-start:hover {
            background: #ff6b81;
        }
        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #6e8efb;
            width: 0%;
            transition: width 0.3s ease;
        }
        .hidden {
            display: none;
        }
        .result-score {
            font-size: 3rem;
            font-weight: bold;
            color: #ff4757;
            margin: 15px 0;
        }
        .result-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .result-desc {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <!-- หน้าแรก -->
        <div id="start-screen">
            <h1>🥱 แบบทดสอบวัดระดับความว่าง</h1>
            <p class="subtitle">คุณว่างจริง หรือแค่อู้ทำงาน? มาพิสูจน์ด้วยระบบ AI (มโนเอาเอง) กันเถอะ!</p>
            <button class="btn-start" onclick="startQuiz()">เริ่มทำแบบทดสอบ</button>
        </div>

        <!-- หน้าคำถาม -->
        <div id="quiz-screen" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <h2 id="question-text" style="color: #333; font-size: 1.2rem;">หัวข้อคำถาม</h2>
            <div id="options-container"></div>
        </div>

        <!-- หน้าผลลัพธ์ -->
        <div id="result-screen" class="hidden">
            <h1>🎉 ประมวลผลเสร็จสิ้น!</h1>
            <div class="result-score" id="final-score">0%</div>
            <div class="result-title" id="result-title">ฉายาของคุณ</div>
            <p class="result-desc" id="result-desc">คำอธิบาย...</p>
            <button class="btn-start" onclick="location.reload()">ทำใหม่อีกรอบ (ถ้ายังว่างอยู่)</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "1. เหตุผลที่เปิดเข้ามาเล่นเว็บนี้คืออะไร?",
                options: [
                    { text: "บังเอิญไถเจอ แล้วก็กดเข้ามา", score: 10 },
                    { text: "ไม่มีอะไรทำเลยจริงๆ หาวจนปากอ้า", score: 25 },
                    { text: "อู้ งานวางกองอยู่ตรงหน้าแต่ขอเล่นก่อน", score: 20 },
                    { text: "นับจุดบนเพดานห้องครบแล้ว เลยมาหาอะไรทำ", score: 30 }
                ]
            },
            {
                q: "2. ตอนนี้คุณทำอะไรอยู่ระหว่างอ่านตัวเลือกนี้?",
                options: [
                    { text: "อ่านทีละตัวอักษรอย่างตั้งใจ", score: 15 },
                    { text: "กระดิกเท้าเป็นจังหวะตามเพลงในหัว", score: 20 },
                    { text: "นั่งถอนหายใจไปแล้ว 3 รอบ", score: 25 },
                    { text: "พยายามหาวให้กว้างที่สุดเท่าที่จะทำได้", score: 30 }
                ]
            },
            {
                q: "3. ถ้าให้เลือกทำ 1 อย่างตอนนี้ คุณจะเลือกอะไร?",
                options: [
                    { text: "ไปนอน (แต่จริงๆ ก็แค่นอนไถมือถือต่อ)", score: 20 },
                    { text: "เปิดตู้เย็นดู ทั้งๆ ที่รู้ว่าไม่มีอะไรกิน", score: 25 },
                    { text: "ส่องฟีดโซเชียลซ้ำๆ หวังว่าจะมีความเคลื่อนไหว", score: 15 },
                    { text: "นั่งรอให้แบบทดสอบนี้จบไวๆ", score: 30 }
                ]
            },
            {
                q: "4. ลองกดปุ่มนี้ 3 ครั้งเพื่อยืนยันว่ายังมีสติอยู่",
                isInteractive: true
            },
            {
                q: "5. ถามจริง... รู้สึกว่าแบบทดสอบนี้ไร้สาระไหม?",
                options: [
                    { text: "ไร้สาระมาก แต่ก็กดมาถึงข้อสุดท้ายแล้วนะ", score: 25 },
                    { text: "ไม่นะ เพลินดีออก (อาการหนัก)", score: 30 },
                    { text: "ว่างจนไม่รู้สึกอะไรแล้ว...", score: 20 },
                    { text: "กดๆ ไปเหอะ อยากเห็นผลลัพธ์แล้ว", score: 15 }
                ]
            }
        ];

        let currentQuestion = 0;
        let totalScore = 0;
        let clickCount = 0;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.q;
            
            // อัปเดต Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            // กรณีข้อพิเศษ (ปุ่มกดสะสม)
            if (q.isInteractive) {
                clickCount = 0;
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.style.textAlign = 'center';
                btn.innerText = `กดตรงนี้อีก 3 ครั้ง (เหลือ 3)`;
                btn.onclick = () => {
                    clickCount++;
                    const remain = 3 - clickCount;
                    if (remain > 0) {
                        btn.innerText = `กดตรงนี้อีก 3 ครั้ง (เหลือ ${remain})`;
                    } else {
                        selectOption(30);
                    }
                };
                container.appendChild(btn);
                return;
            }

            // ตัวเลือกทั่วไป
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.score);
                container.appendChild(btn);
            });
        }

        function selectOption(score) {
            totalScore += score;
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const scorePercent = Math.min(100, Math.round((totalScore / 145) * 100));
            document.getElementById('final-score').innerText = `${scorePercent}%`;

            let title = "";
            let desc = "";

            if (scorePercent < 50) {
                title = "ระดับ: ว่างแบบพอเป็นพิธี";
                desc = "คุณแค่แวะมาอู้เล็กๆ น้อยๆ ยังพอมีสติและงานการให้ทำ แนะนำให้รีบปิดหน้านี้แล้วกลับไปทำงานได้แล้วครับ!";
            } else if (scorePercent < 80) {
                title = "ระดับ: ว่างขั้นมืออาชีพ";
                desc = "เข้าขั้นแล้ว! คุณเริ่มปล่อยใจให้ลอยไปกับความว่างเปล่า สมองเริ่มหยุดสั่งการแล้ว ลองไปเดินเล่น หรือหาอะไรกินแก้เบื่อหน่อยไหม?";
            } else {
                title = "ระดับ: ปรมาจารย์แห่งจักรวาลความว่าง";
                desc = "ยินดีด้วย! คุณว่างระดับวิกฤต! ว่างจนองค์การ NASA อยากดึงตัวไปศึกษาความเงียบสงบในจิตใจ การที่คุณนั่งเล่นเกมนี้จนจบได้ คือหลักฐานมัดตัวว่าคุณไร้ภาระอย่างสมบูรณ์แบบ!";
            }

            document.getElementById('result-title').innerText = title;
            document.getElementById('result-desc').innerText = desc;
        }
    </script>
</body>
</html>
